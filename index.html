<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p6 - card design code</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
       * {
            box-sizing: border-box;
       }
       body {
            display: flex;
            background-color: white;
            font-family: "Poppins", sans-serif;
        }
        .targeta {
            display: flex;
            flex-direction: row;
            width: 360px;
            height: 194px;
            margin:auto;
            overflow: hidden;
        }
        .text {
            width: 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            padding-top: 14px;
            background-color: #f2f2f2;
        }
        .capcalera {
            line-height: 5px;
        }
        h1 {
            font-size: 16px;
            font-weight: 600;
            color: #e5a100;
        }
        h2 {
            font-size: 12px;
            font-weight: 400;
        }
        .contacte {
            font-size: 9px;
            line-height: 7px;
        }
        .imatge {
            width: 50%;
            height: 100%;
        }
        img {
            width:100%;
            height: 100%;
            object-fit: cover;
        }
        @media (max-width: 600px) {
            .targeta{
                flex-direction: column;
                width: 100%;
                max-width: 180px;
                height: auto;
            }
            .imatge {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="targeta">
        <div class="text">
            <div class="capcalera">
                <h1>John Doe</h1>
                <h2>Chef de Cocina</h2>
            </div>
            <div class="contacte">
                <p>19/22 McKensy Street</p>
                <p>Vic 3212, Vienna, Austria</p>
                <p>+82 4 3123 3489</p>
                <p>contact@yoursite.com</p>
            </div>
        </div>
        <div class="imatge">
            <img src="img/patro.jpg" alt="Patro geometric">
        </div>
    </div>
</body>
</html>
